name: CI Flask

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restaurer le cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer flake8
        run: python -m flake8 src tests

      - name: Preparer le dossier de couverture
        run: mkdir -p coverage-report

      - name: Lancer pytest avec couverture
        run: |
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage-report

      - name: Ajouter un message si le rapport est incomplet
        if: always()
        run: |
          if [ ! -f coverage-report/index.html ]; then
            echo "Le rapport HTML n'a pas pu etre genere completement." \
              > coverage-report/README.txt
          fi

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: warn
