name: CI Flask

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer le cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier le formatage avec Black
        run: black --check src/ tests/

      - name: Verifier le lint avec Ruff
        run: ruff check src/ tests/

      - name: Analyser la securite avec Bandit
        run: bandit -r src/ -ll

      - name: Analyser la securite avec Semgrep
        run: semgrep --config auto --error src/

      - name: Lancer pytest avec couverture
        run: |
          mkdir -p coverage-report
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

      - name: Analyser le projet avec SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report/
            coverage.xml
          if-no-files-found: warn

  docker:
    needs: quality-and-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de l'image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:sha-$SHORT_SHA \
            -t $IMAGE:latest \
            .

      - name: Tester le conteneur
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker run -d -p 5000:5000 --name test-container $IMAGE:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health
          docker stop test-container
          docker rm test-container

      - name: Push de l'image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:sha-$SHORT_SHA
          docker push $IMAGE:latest
