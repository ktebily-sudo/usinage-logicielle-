name: CI Flask

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer le cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier le formatage avec Black
        run: black --check src/ tests/

      - name: Verifier le lint avec Ruff
        run: ruff check src/ tests/

      - name: Analyser la securite avec Bandit
        run: bandit -r src/ -ll

      - name: Analyser la securite avec Semgrep
        run: semgrep --config auto --error src/

      - name: Lancer pytest avec couverture
        run: |
          mkdir -p coverage-report
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

      - name: Analyser le projet avec SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report/
            coverage.xml
          if-no-files-found: warn
